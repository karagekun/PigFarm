<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />
  <title>Pig Farm Demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <div class="topbar">
      <div class="brand">
        <strong>Pig Farm Demo</strong>
        <div class="subtle">
          Tap the barn for food stock. Tap the pig house for pig management.
        </div>
      </div>

      <div class="badges">
        <div class="badge" id="moneyInfo">Money: $0</div>
        <div class="badge" id="selectedFoodInfo">Selected Feed: --</div>
        <div class="badge" id="stockInfo">Stock: --</div>
        <div class="badge" id="worldInfo">Pigs: 0 | Poop: 0</div>
        <div class="badge" id="saveInfo">Saved: --</div>
      </div>
    </div>

    <div class="game-shell">
      <div class="canvas-card">
        <canvas id="gameCanvas" width="960" height="600"></canvas>
      </div>

      <p id="tapHint" class="tap-hint">
        Tap the barn to manage food, tap the pig house to manage pigs, tap poop to sell it, and tap the farm to place selected food.
      </p>
    </div>
  </div>

  <div id="cardScrim" class="card-scrim"></div>

  <section id="buildingCard" class="building-card" aria-hidden="true">
    <div class="building-card__header">
      <div>
        <h2 id="cardTitle">Card</h2>
        <p id="cardSubtitle" class="card-subtitle"></p>
      </div>
      <button id="closeCardBtn" class="icon-btn" aria-label="Close">×</button>
    </div>
    <div id="cardBody" class="building-card__body"></div>
  </section>

  <script src="app.js"></script>
</body>
</html>
